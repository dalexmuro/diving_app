name: Security Gates

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gitleaks-history-scan:
    name: Gitleaks Full Git History Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and run Gitleaks CLI on full Git history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --verbose --redact --config=.gitleaks.toml .

  repo-policy-linters-and-tests:
    name: Policy, PII, Linters & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install backend dependencies & run tests (when present)
        if: hashFiles('backend/package-lock.json') != ''
        working-directory: backend
        run: npm ci && npm test

      - name: Install web dependencies & run tests (when present)
        if: hashFiles('web/package-lock.json') != ''
        working-directory: web
        run: npm ci && npm test

      - name: Run custom security & PII policy gate
        run: python scripts/security/check_staged_security.py --all-tracked

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks on all files
        env:
          SKIP: security-staging-gate,gitleaks
        run: pre-commit run --all-files

  dependency-sca-audit:
    name: Dependency & SCA Vulnerability Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Audit backend production npm dependencies (when present)
        if: hashFiles('backend/package-lock.json') != ''
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit web production npm dependencies (when present)
        if: hashFiles('web/package-lock.json') != ''
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
