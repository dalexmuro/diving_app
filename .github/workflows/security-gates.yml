name: Security Gates

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gitleaks-history-scan:
    name: Gitleaks Full Git History Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan entire Git history with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  repo-policy-and-linters:
    name: Policy, PII & Pre-commit Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run custom security & PII policy gate
        run: python scripts/security/check_staged_security.py --all-tracked

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks on all files
        env:
          SKIP: security-staging-gate
        run: pre-commit run --all-files

  dependency-sca-audit:
    name: Dependency & SCA Vulnerability Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OSV-Scanner on repository dependencies
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        with:
          scan-args: |-
            -r .
        continue-on-error: false

      - name: Audit backend npm dependencies (when present)
        if: hashFiles('backend/package-lock.json') != ''
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Audit web npm dependencies (when present)
        if: hashFiles('web/package-lock.json') != ''
        working-directory: web
        run: npm audit --audit-level=high
