name: Deploy to Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-check:
    name: Verify Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history with Gitleaks CLI
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --verbose --redact --config=.gitleaks.toml .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run repository security & PII policy gate
        run: python scripts/security/check_staged_security.py --all-tracked

  deploy-fullstack:
    name: Build PWA, Migrate D1 & Deploy Worker
    needs: security-check
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install & test web PWA
        working-directory: web
        run: npm ci && npm test && npm run build

      - name: Install & test backend Worker
        working-directory: backend
        run: npm ci && npm test

      - name: Apply D1 migrations & deploy Full-Stack Worker (API + PWA Static Assets)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply diving-db --remote
          npx wrangler deploy
